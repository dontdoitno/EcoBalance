services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecobalance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ecobalance}
    ports:
      - "5432:5432"
    volumes:
      - ecobalance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecobalance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ecobalance:change-me@db:5432/ecobalance}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/.venv

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/contracts:/app/packages/contracts
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/node_modules

  docs:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /docs
    volumes:
      - ./:/docs
    ports:
      - "8001:8001"
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends git &&
      rm -rf /var/lib/apt/lists/* &&
      pip install --no-cache-dir mkdocs-material mkdocs-mermaid2-plugin
      pymdown-extensions mkdocs-glightbox mkdocs-git-revision-date-localized-plugin
      mkdocs-swagger-ui-tag &&
      mkdocs serve -a 0.0.0.0:8001"

volumes:
  ecobalance_db_data:
