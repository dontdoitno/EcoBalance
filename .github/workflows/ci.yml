name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stopwords check
        run: ./scripts/check_stopwords.sh

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ecobalance
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ecobalance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecobalance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ecobalance:ci-password@localhost:5432/ecobalance_test
    steps:
      - uses: actions/checkout@v4
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info fonts-dejavu-core
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Types (mypy --strict on ecobalance_core, plain on app)
        run: |
          uv run mypy --strict ecobalance_core
          uv run mypy app
      - name: Tests (pytest — ecobalance_core + API integration)
        run: uv run pytest --cov=ecobalance_core

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint (eslint)
        run: pnpm lint
      - name: Types (tsc)
        run: pnpm exec tsc --noEmit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mkdocs
        run: >
          pip install mkdocs-material mkdocs-mermaid2-plugin
          pymdown-extensions mkdocs-glightbox
          mkdocs-git-revision-date-localized-plugin mkdocs-swagger-ui-tag
      - name: Build (strict)
        run: mkdocs build --strict
